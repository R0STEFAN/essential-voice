name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Install NDK and CMake
        run: |
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1" || true
          mkdir -p ~/.android ~/.config
          sudo chown -R $USER:$USER /home/runner

      - name: Clone whisper.cpp
        run: |
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git whisper-src

      - name: Clone sherpa-onnx
        run: |
          git clone --depth 1 https://github.com/k2-fsa/sherpa-onnx.git sherpa-onnx-src || true

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: essential-voice-apk
          path: app/build/outputs/apk/debug/*.apk
